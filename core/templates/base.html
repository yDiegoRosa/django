{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Plataforma de gestão de produtos Django 1.0{% endblock %}">
    <title>{% block title %}Django 1.0{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="{% url 'index' %}" class="navbar-brand">
            <span class="brand-icon">D1</span>
            Django 1.0
        </a>
        <ul class="navbar-links">
            <li><a href="{% url 'index' %}" class="{% block nav_home %}{% endblock %}">🏠 Início</a></li>
            <li><a href="{% url 'contato' %}" class="{% block nav_contact %}{% endblock %}">✉️ Contato</a></li>
        </ul>
    </nav>

    <!-- Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 <a href="{% url 'index' %}">Django 1.0</a> — Desenvolvido por Diego Silva</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
